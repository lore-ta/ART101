<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pikachu and Pikabaddie</title>

    <link rel="stylesheet" href="talking.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="talking.js" defer></script>
</head>

<body>

    <p id="turn-message">Click Pikachu to start.</p>

    <div id="scene">

        <div class="character" id="panel-a">
            <h2>Pikachu</h2>
            <img id="character-a" src="a.gif.gif" alt="Character A">
        </div>

        <div class="character" id="panel-b">
            <h2>Pikabaddie</h2>
            <img id="character-b" src="b.gif.gif" alt="Character B">
        </div>

    </div>

    <div id="chat"></div>

    <div id="answers">
        <button id="answer-black" type="button">black</button>
        <button id="answer-yellow" type="button">yellow</button>
    </div>
</body>
</html>
